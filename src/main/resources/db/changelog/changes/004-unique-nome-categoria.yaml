databaseChangeLog:
  - changeSet:
      id: 004-01-unique-nome-normalizado-categoria
      author: notoriusfight
      comment: Garante no PostgreSQL a unicidade do nome da categoria sem diferenciar maiúsculas.
      changes:
        - sql:
            sql: >
              CREATE UNIQUE INDEX uk_categoria_nome_lower
              ON categoria (LOWER(BTRIM(nome)))
      rollback:
        - sql:
            sql: >
              DROP INDEX uk_categoria_nome_lower
